name: Build distributables (Linux + Windows)

# Genera los instaladores nativos de la aplicación (paquete .deb para Linux y .msi para
# Windows) usando el empaquetado de Compose Desktop (jpackage), que necesita ejecutarse en
# cada sistema operativo objetivo — jpackage no soporta cross-compilation desde Linux hacia
# Windows, por lo que se usa una matriz de runners de GitHub Actions (ubuntu-latest +
# windows-latest) en lugar de Docker.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    name: Build y tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache de dependencias Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Compilar y ejecutar tests
        shell: bash
        run: ./gradlew --no-daemon build

  package:
    name: Empaquetar distribuible (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: packageReleaseDeb
            artifact-glob: build/compose/binaries/main-release/deb/*.deb
            artifact-name: colorblind3d-linux-deb
          - os: windows-latest
            task: packageReleaseMsi
            artifact-glob: build/compose/binaries/main-release/msi/*.msi
            artifact-name: colorblind3d-windows-msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache de dependencias Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Generar el instalador nativo (${{ matrix.task }})
        shell: bash
        run: ./gradlew --no-daemon ${{ matrix.task }}

      - name: Publicar el artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

      - name: Adjuntar a la release (solo en tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-glob }}
